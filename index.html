.step-shots{display:flex;flex-direction:column;gap:14px;margin:13px 0 18px}
.step-shot{margin:0;border:1px solid #e5e5f0;border-radius:14px;background:#fafaff;padding:10px;overflow:hidden}
.shot-open{position:relative;display:flex;justify-content:center;align-items:center;min-height:68px;width:100%;background:#fff;border:1px solid #ececf2;border-radius:9px;padding:10px;cursor:zoom-in;overflow:hidden}
.shot-open:hover{border-color:#a9a2e5;background:#fdfcff}
.shot-open img{display:block;max-width:100%;width:auto;height:auto;max-height:420px;object-fit:contain;box-shadow:0 2px 14px #24244b12;border-radius:6px}
.shot-zoom-tag{position:absolute;bottom:12px;right:12px;background:#302c5cdb;color:#fff;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;box-shadow:0 2px 10px #19173522}
.shot-caption{font-size:11.5px;line-height:1.6;color:#5c6177;margin:9px 2px 1px;text-align:center}
.step-shot-error{display:none;color:#a04441;background:#fff6f4;padding:12px;font-size:12px;overflow-wrap:anywhere;border-radius:8px}
.step-shot.is-broken .shot-open{display:none}
.step-shot.is-broken .step-shot-error{display:block}
.shot-dialog{border:0;padding:0;background:transparent;color:#fff;width:min(96vw,1380px);max-width:1380px;max-height:95vh;overflow:visible}
.shot-dialog::backdrop{background:rgba(10,14,35,.91)}
.shot-dialog-inner{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;max-height:95vh}
.shot-dialog img{display:block;width:auto;max-width:100%;max-height:calc(95vh - 105px);height:auto;object-fit:contain;border-radius:8px;background:#fff}
.shot-dialog-caption{font-size:13px;line-height:1.5;text-align:center;color:#e9e8ff;max-width:850px;margin:0}
.shot-dialog-close{align-self:flex-end;border:1px solid #ffffff6a;background:#343149;color:white;padding:8px 12px;border-radius:9px;font-weight:750;cursor:pointer}
.shot-dialog-close:hover{background:#57516d}
@media(max-width:700px){.step-shot{padding:7px}.shot-open{padding:6px}.shot-open img{max-height:340px}.shot-zoom-tag{font-size:10px;padding:5px 7px}.shot-dialog img{max-height:calc(95vh - 125px)}}
@media print{.shot-zoom-tag,.shot-dialog{display:none!important}.step-shot{break-inside:avoid}.shot-open{border:0!important;padding:0!important}.shot-open img{max-height:360px}}

function footer(){return `<p class="sitefoot">Tài liệu tham khảo: Microsoft Support · Cập nhật nội dung 12/10/2026 · Hình minh họa theo bước do bộ phận IT biên tập; sơ đồ mô phỏng chỉ xuất hiện khi chưa có screenshot thực tế. Một số giao diện/tính năng phụ thuộc phiên bản và chính sách Microsoft 365 của tổ chức.</p>`}
function hero(){return `<div class="hero"><div class="hero-copy"><span class="eyebrow">${ico('check','sm')} TRA CỨU THEO NHU CẦU · KHÔNG CẦN ĐỌC CẢ TÀI LIỆU</span><h1>Bạn cần làm gì<br>với <span>Teams Meeting?</span></h1><p>Chọn đúng công việc hoặc thiết bị đang sử dụng. Trang sẽ chỉ hiển thị hướng dẫn cho mục bạn chọn, rõ ràng và dễ làm theo từng bước.</p><div class="hero-action"><button class="btn" data-open="schedule">${ico('calendar','sm')} Tôi muốn tổ chức họp</button><button class="btn ghost" data-open="join-pc">${ico('video','sm')} Tôi muốn tham gia</button></div></div><div class="hero-art" aria-hidden="true"><div class="hero-window"><div class="hero-winbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="hero-mosaic"><div class="person"><div class="avatar"></div></div><div class="person"><div class="avatar"></div></div><div class="person"><div class="avatar"></div></div><div class="person"><div class="avatar"></div></div></div></div><div class="hero-float">${ico('check','sm')} Sẵn sàng tham gia cuộc họp</div></div></div>`}
function renderHome(){curId=null;focusMode=false;let fav=[['schedule','calendar','Tổ chức cuộc họp','Đặt lịch và gửi thư mời'],['join-pc','monitor','Tham gia bằng máy tính','Windows / Mac / trình duyệt'],['join-android','smartphone','Tham gia bằng Android','Samsung, OPPO, Xiaomi...'],['join-ios','apple','Tham gia bằng iPhone','iPhone và iPad']];let choices=fav.map(([id,ic,title,desc])=>`<button class="choice-card" data-open="${id}"><span class="choice-icon">${ico(ic,'lg')}</span><strong>${title}</strong><small>${desc}</small><span class="choice-footer">Xem hướng dẫn ${ico('chevron')}</span></button>`).join('');let extras=['login','instant','share-link','join-guest','join-id','controls','share-screen','background','lobby','record','mobile-share','troubleshoot'];let tiles=extras.map(id=>{let d=byId[id];return `<button data-open="${d.id}" class="topic-tile"><span class="topic-ic">${ico(d.icon,'sm')}</span><span><strong>${d.title}</strong><small>${d.minutes} · ${d.platform}</small></span>${ico('chevron','sm chev')}</button>`}).join('');$('#view').innerHTML=`${hero()}<div class="section-title"><div><h2>Bắt đầu từ nhu cầu của bạn</h2><p>Chọn 1 mục để mở trang hướng dẫn riêng</p></div></div><div class="cards">${choices}</div><div class="section-title"><div><h2>Các hướng dẫn khác</h2><p>Những tác vụ thường gặp khi làm việc với Teams Meeting</p></div><button class="small-link" id="seeAll">Tất cả ${guides.length} chủ đề ${ico('chevron','sm')}</button></div><div class="topic-grid">${tiles}</div><div class="tipbar"><span class="tip-ic">${ico('info')}</span><div><strong>Tham gia cuộc họp không nhất thiết phải đăng nhập Microsoft.</strong><p>Khách có thể nhập tên để tham gia nếu chính sách cho phép. Một số cuộc họp cần chờ người tổ chức duyệt hoặc xác minh email.</p></div></div>${footer()}`;}
function preview(type){let header=`<div class="minibar"><span></span><span></span><span></span></div>`;let inner='';if(type==='android'||type==='ios'){inner=`<div class="mobile-scene"><div class="phone"><div class="phone-content"><b>Microsoft Teams</b><div class="miniline medium"></div><div class="miniline short"></div><div class="minifield">Join as a guest</div><div class="minifield">Nhập tên của bạn</div><div class="mini-btn">Join meeting</div></div><div class="phone-badge">${type==='ios'?'iPhone / iPad':'Android'}</div></div></div>`;}else if(type==='meeting'||type==='lobby'){inner=`<div class="miniapp">${header}<div class="miniwrap"><div class="minitop"><b>${type==='lobby'?'Participants':'Cuộc họp đang diễn ra'}</b><em>Teams</em></div>${type==='lobby'?`<div class="miniline medium"></div><div class="minifield">Waiting in the lobby</div><div class="minifield">Khách mời · Admit ✓</div><div class="mini-btn">Admit all</div>`:`<div class="mini-persons"><span></span><span></span><span></span><span></span></div><div class="mini-controls"><span>◉</span><span>◫</span><span>↥</span><span>×</span></div>`}</div></div>`;}else if(type==='calendar'){inner=`<div class="miniapp">${header}<div class="miniwrap"><div class="minitop"><b>Calendar</b><em>New event ＋</em></div><div class="minifield">Tiêu đề cuộc họp</div><div class="minifield">Ngày / Giờ</div><div class="minifield">Thêm người tham dự</div><div class="mini-purpleline"></div><div class="mini-btn">Save / Send</div></div></div>`;}else if(type==='id'){inner=`<div class="miniapp">${header}<div class="miniwrap"><div class="minitop"><b>Join with an ID</b><em>Teams</em></div><div class="minifield">Meeting ID</div><div class="minifield">Passcode</div><div class="mini-btn">Join a meeting</div></div></div>`;}else{inner=`<div class="miniapp">${header}<div class="miniwrap"><div class="minitop"><b>Join meeting</b><em>Teams</em></div><div class="mini-persons"><span></span><span></span></div><div class="minifield">${type==='guest'?'Nhập họ và tên':'Cài đặt âm thanh và video'}</div><div class="mini-btn">Join now</div></div></div>`;}return `<div class="previewbox"><div class="previewcap"><span>MINH HỌA QUY TRÌNH</span><span>Sơ đồ mô phỏng</span></div>${inner}<p class="illustration-desc">Bố cục minh họa để dễ nhận biết thao tác. Giao diện Teams thực tế có thể khác.</p></div>`}
function noteHtml(d){if(!d.tip)return '';return `<div class="guide-note ${d.id==='join-guest'||d.id==='lobby'?'green':''}">${ico('info','sm')}<div><strong>Lưu ý quan trọng</strong><p>${d.tip}</p></div></div>`}
// Lay screenshot theo chu de (id) va so thu tu buoc (1-based). Chi hien anh da khai bao.
function imagesForStep(guideId, stepNumber){
  const all=window.TEAMS_STEP_IMAGES||{};
  const value=(all[guideId]||{})[stepNumber];
  if(!value)return [];
  return (Array.isArray(value)?value:[value]).map(x=>typeof x==='string'?{src:x}:x).filter(x=>x&&typeof x.src==='string'&&/^img\/[a-z0-9_\-./%]+\.(png|jpe?g|webp|gif|svg)$/i.test(x.src)&&!x.src.includes('..'));
}
function shotHtml(d,i){
  const arr=imagesForStep(d.id,i+1);
  if(!arr.length)return '';
  return `<div class="step-shots">${arr.map((pic,j)=>{
    const src=escapeHtml(pic.src),cap=escapeHtml(pic.caption||`Ảnh minh họa bước ${i+1}`);
    const alt=escapeHtml(pic.alt||`Ảnh hướng dẫn: ${d.steps[i][0]}`);
    return `<figure class="step-shot"><button type="button" class="shot-open" data-image-src="${src}" data-image-caption="${cap}" aria-label="Phóng to: ${alt}"><img src="${src}" alt="${alt}" loading="lazy" decoding="async"><span class="shot-zoom-tag">⛶ Phóng to</span></button><div class="step-shot-error">Không tải được ảnh: ${src}. Hãy kiểm tra tên file và đường dẫn trong images.js.</div><figcaption class="shot-caption">${cap}</figcaption></figure>`;
  }).join('')}</div>`;
}
function stepHtml(item,i,d){let [title,body,hint]=item;return `<li class="guide-step" data-step="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="step-body"><h3>${title}</h3><p>${body}</p>${hint?`<div class="step-note">${hint}</div>`:''}${shotHtml(d,i)}</div></li>`}
function srcHtml(d){let refs=[...new Set((d.src||[]).map(k=>sources[k]).filter(Boolean))];return `<div class="src-details"><strong>Tham khảo Microsoft Support</strong>${refs.map((x,i)=>`<a href="${x}" target="_blank" rel="noopener noreferrer">${i+1}. ${x.split('/').pop().replaceAll('-',' ')} ↗</a>`).join('')}</div>`}
function renderGuide(id){let d=byId[id];if(!d){renderHome();return}curId=id;focusMode=false;focusStep=0;let rel=(d.related||[]).map(x=>byId[x]).filter(Boolean);let faq=(d.faq||[]).map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join('');$('#view').innerHTML=`<div class="crumb"><button data-open="home">Trang chủ</button>${ico('chevron','sm')}<span>${groups.find(g=>g.id===d.category)?.title||'HƯỚNG DẪN'}</span>${ico('chevron','sm')}<strong style="color:var(--ink)">${d.title}</strong></div><div class="guide-head"><div class="guide-category"><span class="pill">HƯỚNG DẪN TỪNG BƯỚC</span><span class="pill neutral">${d.platform}</span></div><h1>${d.title}</h1><p>${d.desc}</p><div class="guide-meta"><span>${ico('clock','sm')} Khoảng ${d.minutes}</span><span>${ico('check','sm')} ${d.steps.length} bước thực hiện</span><span>${ico('monitor','sm')} Nội dung độc lập, dễ tra cứu</span></div></div><div class="guide-layout"><div><div class="steps-card"><div class="steps-head"><h2>Các bước thực hiện</h2><button class="mode-btn" id="focusBtn">${ico('check','sm')} Chế độ từng bước</button></div><ol class="guide-steps" id="stepList">${d.steps.map((step,i)=>stepHtml(step,i,d)).join('')}</ol><div class="focusbar" id="focusbar"><span class="focus-current" id="focusCurrent"></span><span class="focus-buttons"><button class="btn outline" id="prevStep">${ico('back','sm')} Quay lại</button><button class="btn" id="nextStep">Tiếp theo ${ico('chevron','sm')}</button></span></div>${noteHtml(d)}<div class="guide-tools"><button class="toolbtn" id="copyGuide">${ico('copy','sm')} Sao chép link mục này</button><button class="toolbtn" id="printGuide">${ico('print','sm')} In hướng dẫn</button></div>${srcHtml(d)}</div>${faq?`<div class="faq-card"><h3>Câu hỏi thường gặp</h3>${faq}</div>`:''}</div><div class="right-col">${d.steps.some((_,i)=>imagesForStep(d.id,i+1).length)?'':preview(d.preview||'desktop')}<div class="related-card"><h3>Tiếp tục khám phá</h3>${rel.map(x=>`<button class="related-btn" data-open="${x.id}">${ico(x.icon,'sm')} ${x.title} ${ico('chevron','sm')}</button>`).join('')}</div></div></div>${footer()}`;updateFocus();}
function updateFocus(){if(!curId||!byId[curId])return;let steps=[...document.querySelectorAll('.guide-step')],n=steps.length;steps.forEach((e,i)=>e.style.display=focusMode&&i!==focusStep?'none':'grid');$('#focusbar').classList.toggle('visible',focusMode);$('#focusBtn').innerHTML=focusMode?`${ico('menu','sm')} Hiện tất cả các bước`:`${ico('check','sm')} Chế độ từng bước`;$('#focusBtn').setAttribute('aria-pressed',String(focusMode));if(focusMode){$('#focusCurrent').textContent=`Bước ${focusStep+1} / ${n}`;$('#prevStep').disabled=focusStep===0;$('#nextStep').innerHTML=focusStep===n-1?`Hoàn thành ${ico('check','sm')}`:`Tiếp theo ${ico('chevron','sm')}`;}}
function showSearch(q){curId=null;focusMode=false;let query=strip(q.trim());let matches=guides.filter(d=>strip([d.title,d.desc,d.platform,d.category,...d.steps.flatMap(s=>s)].join(' ')).includes(query));$('#view').innerHTML=`<div class="search-result-head"><div class="crumb"><button data-open="home">Trang chủ</button>${ico('chevron','sm')}<span>Kết quả tìm kiếm</span></div><h1>Kết quả cho “${escapeHtml(q.trim())}”</h1><p>${matches.length} hướng dẫn phù hợp. Chọn một mục để xem riêng nội dung đó.</p></div>${matches.length?`<div class="search-items">${matches.map(d=>`<button class="search-item" data-open="${d.id}"><span class="topic-ic">${ico(d.icon)}</span><span><strong>${d.title}</strong><small>${d.desc}</small></span>${ico('chevron')}</button>`).join('')}</div>`:`<div class="empty">${ico('help','lg')}<h3>Chưa có kết quả phù hợp</h3><p>Thử tìm bằng “Android”, “đặt lịch”, “không đăng nhập”, “ghi hình” hoặc “chia sẻ màn hình”.</p><button class="btn outline" data-open="home">Quay về trang chủ</button></div>`}`;renderSidebar();closeMenu();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2800)}
function render(){let hash=decodeURIComponent(location.hash||'#home');if(hash.startsWith('#guide/')){let id=hash.slice(7);renderGuide(id)}else{renderHome()}renderSidebar();closeMenu();window.scrollTo({top:0,behavior:'instant'});}
async function copyCurrent(){const text=location.href;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('not supported')}toast(location.protocol==='file:'?'Đã sao chép. Link file:// chỉ mở được nếu có cùng file trên máy.':'Đã sao chép liên kết trực tiếp đến mục này.')}catch(e){toast('Không sao chép tự động được. Hãy dùng thanh địa chỉ để sao chép liên kết.')}}
$('#lightboxClose').addEventListener('click',()=>$('#imageLightbox').close());$('#imageLightbox').addEventListener('click',e=>{if(e.target.id==='imageLightbox')e.target.close()});document.body.addEventListener('error',e=>{if(e.target.matches('.step-shot img'))e.target.closest('.step-shot')?.classList.add('is-broken')},true);
$('#menuToggle').addEventListener('click',()=>{let open=$('#sidebar').classList.toggle('open');$('#backdrop').classList.toggle('visible',open);$('#menuToggle').setAttribute('aria-expanded',String(open));});$('#backdrop').addEventListener('click',closeMenu);$('#homeBtn').addEventListener('click',()=>navigate('home'));
document.body.addEventListener('click',event=>{let imageButton=event.target.closest('[data-image-src]');if(imageButton){let dlg=$('#imageLightbox');$('#lightboxImage').src=imageButton.dataset.imageSrc;$('#lightboxImage').alt=imageButton.querySelector('img')?.alt||'Ảnh minh họa';$('#lightboxCaption').textContent=imageButton.dataset.imageCaption||'';dlg.showModal();return}let ob=event.target.closest('[data-open]');if(ob){navigate(ob.dataset.open);return}let btn=event.target.closest('button');if(!btn)return;if(btn.id==='seeAll'){showSearch('');$('#searchInput').focus();return}if(btn.id==='focusBtn'){focusMode=!focusMode;focusStep=0;updateFocus();return}if(btn.id==='prevStep'){focusStep=Math.max(0,focusStep-1);updateFocus();return}if(btn.id==='nextStep'){let total=byId[curId].steps.length;if(focusStep===total-1){focusMode=false;updateFocus();toast('Bạn đã xem hết các bước hướng dẫn.')}else{focusStep++;updateFocus()}return}if(btn.id==='copyGuide'){copyCurrent();return}if(btn.id==='printGuide'){window.print();return}});
$('#searchInput').addEventListener('input',e=>{let q=e.target.value;if(q.trim()){if(location.hash!=='#search'){history.replaceState(null,'','#search')}showSearch(q)}else{if(location.hash==='#search'){history.replaceState(null,'','#home');renderHome();renderSidebar()}}});$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){let first=$('.search-item');if(first){navigate(first.dataset.open);$('#searchInput').blur()}}if(e.key==='Escape'){$('#searchInput').value='';navigate('home');$('#searchInput').blur()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus();$('#searchInput').select()}if(e.key==='Escape')closeMenu()});window.addEventListener('hashchange',render);
if(!location.hash){history.replaceState(null,'','#home')}render();
})();
</script>
</body>
</html>
